name: Build offline static package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify offline game
        run: npm run build:offline

      - name: Run unit tests
        run: npm test

      - name: Package static files
        run: |
          cd dist-offline
          zip -9 -r ../hitwar-offline-single-player.zip .

      - name: Upload offline static package
        uses: actions/upload-artifact@v4
        with:
          name: hitwar-offline-single-player
          path: hitwar-offline-single-player.zip
          if-no-files-found: error
          retention-days: 30
